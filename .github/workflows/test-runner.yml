name: Test Raspberry Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on:
      - self-hosted
      - raspberry
      - arm64

    steps:
      - name: Runner information
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "Hostname: $(hostname)"

      - name: Docker information
        run: |
          docker version
          docker compose version