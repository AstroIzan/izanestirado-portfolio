name: Deploy Portfolio

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

env:
  APP_NAME: izanestirado-portfolio
  DEPLOY_PATH: /home/deploy/deployments/izanestirado-portfolio

jobs:

  # ============================================================
  # TEST
  # ============================================================
  test:
    name: Test
    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Angular dependencies
        working-directory: client
        run: npm ci

      - name: Run Angular tests
        working-directory: client
        run: npm test -- --no-watch --no-progress


  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build
    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - deploy

    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${DEPLOY_PATH}"
          mkdir -p "${DEPLOY_PATH}"

      - name: Copy application
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --delete \
            --exclude '.git' \
            --exclude '.env' \
            ./ \
            "${DEPLOY_PATH}/"

      - name: Create build environment
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
          } > "${DEPLOY_PATH}/.env"

          chmod 600 "${DEPLOY_PATH}/.env"

      - name: Build Docker images
        shell: bash
        run: |
          set -euo pipefail

          sudo /usr/local/sbin/app-build "${APP_NAME}"


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy
    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - deploy

    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${DEPLOY_PATH}"
          mkdir -p "${DEPLOY_PATH}"

      - name: Copy application
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --delete \
            --exclude '.git' \
            --exclude '.env' \
            ./ \
            "${DEPLOY_PATH}/"

      - name: Create production environment
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
          } > "${DEPLOY_PATH}/.env"

          chmod 600 "${DEPLOY_PATH}/.env"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          sudo /usr/local/sbin/app-deploy "${APP_NAME}"


  # ============================================================
  # HEALTH CHECK
  # ============================================================
  health-check:
    name: Health Check
    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - deploy

    needs: deploy

    steps:
      - name: Check application
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking HTTP..."

          curl -fsS \
            --max-time 10 \
            http://127.0.0.1:8080/ \
            > /dev/null

          echo "HTTP: OK"

          echo
          echo "Checking API..."

          curl -fsS \
            --max-time 10 \
            http://127.0.0.1:8080/api/ \
            > /dev/null || {
              echo "API endpoint returned an error."
              exit 1
            }

          echo "API: OK"

          echo
          echo "Checking containers..."

          cd /srv/apps/izanestirado-portfolio

          sudo docker compose ps

          echo
          echo "Health check completed successfully."