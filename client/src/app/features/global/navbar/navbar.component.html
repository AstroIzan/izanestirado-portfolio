<header class="top-menu" [class.is-menu-open]="isMenuOpen()">

  <button
    type="button"
    class="menu-panel panel-theme"
    (click)="onToggleTheme()"
    [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    <span class="panel-icon">
      {{ isDarkMode ? '☾' : '☀' }}
    </span>
    <span>
      {{ isDarkMode ? 'Black Mode' : 'White Mode' }}
    </span>
  </button>

  <nav id="main-navigation" class="menu-panel panel-nav" aria-label="Main navigation">
    <a href="#home" (click)="closeMenu()">Home</a>
    <a [attr.href]="siteMode === 'work' ? '#experience' : '#personal'" (click)="closeMenu()">
      {{ siteMode === 'work' ? 'Experience' : 'Personal' }}
    </a>
    <a [attr.href]="siteMode === 'work' ? '#projects' : '#volunteer'" (click)="closeMenu()">
      {{ siteMode === 'work' ? 'Projects' : 'Volunteer' }}
    </a>
    <a [attr.href]="siteMode === 'work' ? '#skills' : '#hobbies'" (click)="closeMenu()">
      {{ siteMode === 'work' ? 'Skills' : 'Hobbies' }}
    </a>
    <a href="#contact" (click)="closeMenu()">Contact</a>
  </nav>

  <div
    class="menu-panel panel-mode"
    [class.is-work]="menuMode === 'work'"
    [class.is-hobbie]="menuMode === 'hobbie'"
  >
    <button
      type="button"
      [class.active]="menuMode === 'work'"
      [disabled]="isTransitioningMode"
      (click)="onSelectMode('work')"
    >
      Work
    </button>

    <button
      type="button"
      [class.active]="menuMode === 'hobbie'"
      [disabled]="isTransitioningMode"
      (click)="onSelectMode('hobbie')"
    >
      Hobby
    </button>
  </div>

  <button
    type="button"
    class="menu-toggle"
    [attr.aria-expanded]="isMenuOpen()"
    aria-controls="main-navigation"
    aria-label="Toggle navigation menu"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

</header>
