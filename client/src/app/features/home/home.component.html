<main
  class="page"
  [class.dark-mode]="isDarkMode()"
  [class.light-mode]="!isDarkMode()"
  [attr.data-site-mode]="siteMode()"
>

  <app-top-navbar
    [isDarkMode]="isDarkMode()"
    [siteMode]="siteMode()"
    [menuMode]="menuMode()"
    [isTransitioningMode]="isTransitioningMode()"
    (toggleTheme)="toggleColorMode()"
    (siteModeChange)="switchSiteMode($event)"
  />

  <app-home-hero-section
    [siteMode]="siteMode()"
    [gridVerticalLines]="gridVerticalLines"
    [gridHorizontalLines]="gridHorizontalLines"
  />

  <app-home-feature-section
    [sectionId]="siteMode() === 'work' ? 'experience' : 'personal'"
    indexLabel="01"
    [title]="siteMode() === 'work' ? 'Experience' : 'Personal'"
    [description]="siteMode() === 'work' ? 'Build. Run. Improve. Reliable web systems.' : 'Volunteer forest-fire operations: prevention, training, and real incident response.'"
  />

  <app-home-feature-section
    [sectionId]="siteMode() === 'work' ? 'projects' : 'volunteer'"
    indexLabel="02"
    [title]="siteMode() === 'work' ? 'Projects' : 'Volunteer'"
    [description]="siteMode() === 'work' ? 'APIs, dashboards, pipelines, and production tooling.' : 'Astronomy and astrophotography sessions focused on planning, tracking, and long exposures.'"
  />

  <app-home-feature-section
    [sectionId]="siteMode() === 'work' ? 'skills' : 'hobbies'"
    indexLabel="03"
    [title]="siteMode() === 'work' ? 'Skills' : 'Hobbies'"
    [isSkillsShell]="true"
  >
    <app-skills-showcase [siteMode]="siteMode()" />
  </app-home-feature-section>

  <app-home-contact-section [siteMode]="siteMode()" />

  <app-home-footer [currentYear]="currentYear" />

</main>

@if (isTransitioningMode()) {
  <app-mode-transition-overlay
    [pendingMode]="pendingMode()"
    [transitionPhase]="modeTransitionPhase()"
  />
}
