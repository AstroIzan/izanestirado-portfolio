<div
  class="mode-loader"
  [class.is-revealing]="transitionPhase === 'revealing'"
  aria-live="polite"
  aria-label="Changing visual style"
>
  <div class="loader-card">
    <span class="loader-kicker">Switching vibe</span>
    <h3>
      {{ pendingMode === 'work' ? 'Work Mode' : 'Hobby Mode' }}
    </h3>
    <div class="loader-animation">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>
