<main
	class="page"
	[class.dark-mode]="isDarkMode()"
	[class.light-mode]="!isDarkMode()"
	[attr.data-site-mode]="siteMode()"
>

	<app-navbar
		[isDarkMode]="isDarkMode()"
		[siteMode]="siteMode()"
		[menuMode]="menuMode()"
		[isTransitioningMode]="isTransitioningMode()"
		(toggleTheme)="toggleColorMode()"
		(siteModeChange)="switchSiteMode($event)"
	/>

	<app-home
		[siteMode]="siteMode()"
		[gridVerticalLines]="gridVerticalLines"
		[gridHorizontalLines]="gridHorizontalLines"
	/>

	@if (siteMode() === 'work') {
		<app-work-experience />
		<app-work-projects />
		<app-work-skills />

		<app-contact id="contact" class="content-section" />

		<app-footer [currentYear]="currentYear" />
	}

</main>

@if (isTransitioningMode()) {
	<app-mode-overlay
		[pendingMode]="pendingMode()"
		[transitionPhase]="modeTransitionPhase()"
	/>
}
